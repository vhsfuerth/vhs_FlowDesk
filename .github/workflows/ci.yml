name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Lint, Typprüfung, Tests, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vhs-flowchart-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vhs-flowchart-editor/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
